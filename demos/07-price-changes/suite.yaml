# Price recommendations: synthetic numbers only; never applied to a live catalog.
title: Price recommendations
description: Approve the model's price per product, adjust it if needed, and stage the approved prices in the staging catalog.
send: Send to Claude
reviewed: [verdict]
groups:
  - { id: outdoor, label: Outdoor }
  - { id: home, label: Home and office }
questions:
  - { id: approve, kind: toggle, label: Apply, each: products, key: y }
  - id: price
    kind: number
    label: New price
    each: products
    unit: USD
    min: 0
    max: 500
    when: { approve: [true] }
  - id: verdict
    kind: choice
    label: Verdict
    primary: true
    options:
      - { value: ship, label: Ship approved, tone: positive, icon: check }
      - { value: revise, label: Revise model, tone: warning, icon: approx }
      - { value: reject, label: Reject all, tone: negative, icon: cross }
  - id: stage
    kind: action
    label: Stage
    key: a
    summary: Claude writes the approved prices to the staging catalog and opens a PR. Nothing reaches the live store without the normal promote.
    states:
      "off": { button: Let Claude stage these, note: Nothing changes until you approve }
      "on": { button: Approved, note: Stages the rows marked Apply when you send, badge: Stage }
      done: { button: Staged, badge: Staged }
  - id: notes
    kind: text
    label: Notes for Claude
    key: n
    placeholder: Which recommendations look wrong, and why?

items:
  - id: trailhead-supply
    group: outdoor
    title: Trailhead Supply
    subtitle: 5 changes · +62 $/day
    badges: [{ label: Synthetic, tone: neutral }]
    meta: trailhead-supply.example.com · model pricing-v4 · last 28 days
    proposed:
      price:
        value: { tent_2p_us: 199.0, pack_40l_us: 135.0, stove_eu: 62.0, bottle_row: 22.0, socks_us: 16.5 }
        why: Model recommendation
    show:
      - kind: metrics
        label: If every recommendation ships
        metrics:
          - { label: Revenue / day, value: 1542.7, baseline: 1481.0, unit: USD, better: higher, decimals: 0 }
          - { label: Conversion rate, value: 3.12, baseline: 3.15, unit: "%", better: higher, decimals: 2 }
          - { label: Products changed, value: 5 }
      - id: products
        kind: table
        label: Products
        columns: &columns
          - { key: sku, label: SKU }
          - { key: category, label: Category }
          - { key: region, label: Region }
          - { key: current, label: Current, align: right }
          - { key: recommended, label: Model, align: right }
          - { key: revenue, label: $ / day, align: right }
          - { key: conversion, label: Conversion, align: right }
        rows:
          - id: tent_2p_us
            sku: TS-TENT-2P
            category: Tents
            region: US
            current: $189.00
            recommended: $199.00
            revenue: { value: "+41.2", tone: positive }
            conversion: { value: -1.1 pp, tone: neutral }
          - id: pack_40l_us
            sku: TS-PACK-40L
            category: Backpacks
            region: US
            current: $129.00
            recommended: $135.00
            revenue: { value: "+9.8", tone: positive }
            conversion: { value: -0.6 pp, tone: neutral }
          - id: stove_eu
            sku: TS-STOVE-1
            category: Stoves
            region: EU
            current: $59.00
            recommended: $62.00
            revenue: { value: "+6.1", tone: positive }
            conversion: { value: -0.4 pp, tone: neutral }
          - id: bottle_row
            sku: TS-BTL-750
            category: Bottles
            region: Rest of world
            current: $24.00
            recommended: $22.00
            revenue: { value: "+3.9", tone: positive }
            conversion: { value: +1.8 pp, tone: neutral }
          - id: socks_us
            sku: TS-SOCK-M
            category: Socks
            region: US
            current: $16.00
            recommended: $16.50
            revenue: { value: "+0.7", tone: positive }
            conversion: { value: -0.2 pp, tone: neutral }
      - kind: chart
        type: bar
        label: Expected revenue by price · TS-TENT-2P, US
        unit: USD
        y_min: 0
        x: [$169, $179, $189, $199, $209, $219]
        series:
          - { label: Revenue / day, values: [301.4, 322.0, 338.6, 379.8, 352.1, 318.5], tone: accent }
    context:
      - kind: markdown
        label: How the model chose
        text: |-
          **Tents still sell through at $199 in the US; every change stays inside the 3 pp conversion guardrail.**

          - Demand curve from 28 days of orders per product and region.
          - Recommended price maximizes expected revenue with a conversion guardrail of −3 pp.
          - Products whose price would move more than 15% need a human approval even inside the guardrail.

          All numbers in this demo are synthetic.

