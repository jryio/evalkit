# Demo 3: perf canary verdicts for Acme search-api changes in prod-us-east.
# Series are synthetic; tile values are the hourly means after the canary pin.
title: Perf canary verdicts
description: Decide whether each search-api perf change running on canary pods in prod-us-east gets promoted, held or rolled back.
send: Send to Claude
groups:
- {id: pending, label: Awaiting verdict}
- {id: decided, label: Decided}
questions:
- id: decision
  kind: choice
  label: Decision
  primary: true
  options:
  - {value: promote, label: Promote, tone: positive, icon: check}
  - {value: hold, label: Hold, tone: warning, icon: approx}
  - {value: rollback, label: Roll back, tone: negative, icon: cross}
- id: confidence
  kind: scale
  label: Confidence
  key: c
  min: 1
  max: 5
  labels: [Noisy, Clear]
- id: apply
  kind: action
  label: Apply
  key: a
  summary: Claude demotes the canary, then merges or reverts the PR to match your decision.
  states:
    'off': {button: Let Claude apply it, note: Nothing changes in prod until you approve}
    'on': {button: Approved, note: Claude runs canary demote after you send, badge: Apply}
    done: {button: Applied, note: canary demoted, badge: Applied}
- {id: notes, kind: text, label: Notes for Claude, key: n, placeholder: 'What would change your call?'}
items:
