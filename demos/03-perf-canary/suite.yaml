    text: |-
      **Hypothesis.** The query is parsed once at the edge and every shard fan-out reads the same immutable plan, instead of each shard parsing its own copy. Pooled plan structs raise working set a little.

      | Metric | Expected | Guardrail vs fleet |
      |---|---:|---:|
      | Allocations / request | −27 to −34% | none |
      | CPU / request | −13 to −19% | none |
      | p99 latency | −7 to −11% | ≤ +7% |
      | Working set | +7 to +13% | ≤ +14% |
      | Error rate | flat | ≤ +0.04 pp |
      | Timeout rate | flat | ≤ +0.06 pp |
      | Zero-result rate | flat | ≤ +0.3 pp |
      | Cache hit rate | flat | ≥ −0.7 pp |

      Registered in PR #2238 before `canary pin`. Alerts fire on any guardrail breached for 10 min; a human makes the call.

      Demote: `canary demote ENG-1201`
