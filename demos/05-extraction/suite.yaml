# Information extraction review: an extractor pulls fields from invoices and
# receipts; mark each field correct, wrong or missing and type the fix.
title: Invoice extraction
description: Check each field the extractor pulled from vendor invoices and receipts; precision and recall update as you go.
send: Send to Claude
groups:
  - { id: invoices, label: Invoices }
  - { id: receipts, label: Receipts }
reviewed: [verdict]
questions:
  - id: check
    kind: choice
    label: Check
    each: fields
    key: c
    options:
      - { value: correct, label: Correct, tone: positive, icon: check }
      - { value: wrong, label: Wrong, tone: negative, icon: cross }
      - { value: missing, label: Missing, tone: warning, icon: question }
  - id: fix
    kind: text
    label: Correct value
    each: fields
    when: { check: [wrong, missing] }
    placeholder: What it should be
  - id: verdict
    kind: choice
    label: Verdict
    primary: true
    options:
      - { value: usable, label: Usable, tone: positive, icon: check }
      - { value: fixable, label: Needs fixes, tone: warning, icon: approx }
      - { value: unusable, label: Unusable, tone: negative, icon: cross }
  - id: notes
    kind: text
    label: Notes for Claude
    key: n
    placeholder: Patterns the extractor keeps getting wrong

