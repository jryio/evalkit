      - kind: markdown
        label: Task
        text: |-
          **Simulated user**

          > You are Yusuf Rossi, zip 19122. You received order #W2378156. Exchange the mechanical keyboard for the same model with linear switches, RGB backlight and full size. Refund any difference to your credit card. Keep the thermostat. Give your zip code only if asked.

          **Policy excerpt**

          - At the start of the conversation, authenticate the user by finding their user id with their email, or with their name and zip code. Do this even when the user gives a user id or an order id.
          - Delivered items can be exchanged for items of the same product type with different options. Collect every item first; the exchange tool can run once per order.
          - The price difference is paid or refunded with a payment method on file.
          - List the action details and get an explicit "yes" before any write.
