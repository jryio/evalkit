# Generated by build.py from runs/*.json. Edit build.py, not this file.
title: Project status updates
description: 'Review each draft update: approve the live ones to post, compare back-tests with what the owner wrote.'
send: Send to Claude
reviewed:
- verdict
- post
groups:
- id: live
  label: Live drafts
- id: backtest
  label: Back-tests
questions:
- id: health
  kind: choice
  label: Health
  key: h
  status: true
  options:
  - value: onTrack
    label: On track
    tone: positive
  - value: atRisk
    label: At risk
    tone: warning
  - value: offTrack
    label: Off track
    tone: negative
- id: verdict
  kind: choice
  label: Verdict
  primary: true
  options:
  - value: good
    label: Good
    tone: positive
    icon: check
  - value: close
    label: Close
    tone: warning
    icon: approx
  - value: 'off'
    label: 'Off'
    tone: negative
    icon: cross
- id: flags
  kind: multi
  label: Flags
  with: verdict
  options:
  - value: picks
    label: Wrong picks
    key: p
  - value: voice
    label: Not my voice
    key: v
- id: post
  kind: action
  label: Post
  key: a
  groups:
  - live
  summary: Claude posts these to Linear.
  states:
    'off':
      button: Approve for posting
      note: Nothing posts until you approve
    'on':
      button: Approved
      note: Posts to Linear when you send
      badge: Post
    done:
      button: Posted to Linear
      note: edit it in Linear from here on
      badge: Posted
- id: notes
  kind: text
  label: Notes for Claude
  key: n
  placeholder: What would you change? What's missing? How would you say it?
- id: should_be_in
  kind: toggle
  label: Should be in
  each: evidence
items:
