# Hill climb on a Claude Code skill. The skill is copied into each workspace's
# .claude/skills/, so the agent finds it the way a real project's skill is
# found (isolate: project), and an attempt where it did not load is a harness
# error, not a fail. The house format of a changelog line is not in the
# starting skill; the proposer has to work it out from the failures.
#   ../fixtures.sh && evalkit check && evalkit climb --rounds 2
title: Changelog skill · hill climb on a Claude Code skill
description: Each row is a changelog line an agent added while using the skill. Check the lines that break the house format, and tell Claude what the skill should say.
send: Send to Claude
view: runs
runs_from: runs/*/run.json
groups:
  - { id: train, label: Train }
  - { id: test, label: Held-out }
questions:
  - id: verdict
    kind: choice
    label: Verdict
    primary: true
    status: true
    options:
      - { value: pass, label: Pass, tone: positive, icon: check }
      - { value: fail, label: Fail, tone: negative, icon: cross }
  - id: note
    kind: text
    label: Note to Claude
    key: n
    placeholder: What did the grader get wrong, or what should the next run change?
columns:
  - { id: rules_broken, label: Rules broken, better: lower }
  - { id: cost_usd, label: Cost, unit: $, decimals: 4, better: lower }
  - { id: latency_s, label: Latency, unit: s, decimals: 1, better: lower }
  - { id: turns, label: Turns, better: lower }
  - { id: tokens_out, label: Output tokens, better: lower }
dimensions:
  - { id: round, label: Round }
bench:
  cases: cases.jsonl
  concurrency: 5
  timeout: 300
  workspace:
    sources: [{ path: .work/repo }]
  overlay: [{ from: skill, to: repo/.claude/skills/changelog }]   # the skill under test
  agent:
    adapter: claude
    model: claude-haiku-5-5
    effort: low
    isolate: project              # load the workspace's own skills
    require_skills: [changelog]
    prompt: "Add a changelog entry for this change, using the changelog skill: {{.change}}"
  score: [score.py]
  oracle: oracle.py
  "null": 'true'
  climb:
    targets: [skill/SKILL.md]
    train: [train]
    test: [test]
    rounds: 2
    target: 1
    propose: { adapter: claude, model: claude-haiku-5-5, effort: low }
